<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Property CRM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

:root{
  --bg:#080c14;--s1:#0f1520;--s2:#161e2e;--s3:#1c2740;
  --border:#1e2d45;--border2:#2a3d5a;
  --text:#e8edf5;--text2:#8fa3be;--text3:#3d5470;
  --accent:#3b7fff;--accent-d:#2563cc;
  --green:#1db954;--amber:#f0a500;--red:#e5363a;--purple:#9d5cf6;
  --gold:#f5c842;
  --sans:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}
body.role-boss {--proj:#f5c842;}
body.role-agent{--proj:#3b7fff;}
body.p0{--proj:#3b7fff;}body.p1{--proj:#1db954;}
body.p2{--proj:#e5363a;}body.p3{--proj:#9d5cf6;}

/* ── LOGIN ── */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 20px;
  background:radial-gradient(ellipse 90% 60% at 50% -5%,#0d2040 0%,var(--bg) 65%);
}
.login-wrap{width:100%;max-width:400px;}

.login-brand{text-align:center;margin-bottom:36px;}
.login-icon{
  width:72px;height:72px;margin:0 auto 16px;
  background:linear-gradient(145deg,#0f2a50 0%,#1a3a6e 100%);
  border:1px solid #2a4a7e;border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  box-shadow:0 12px 40px rgba(59,127,255,.2),0 0 0 1px rgba(59,127,255,.1);
}
.login-brand h1{
  font-size:1.65rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff 40%,#8fa3be);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-brand h1 em{
  font-style:normal;
  background:linear-gradient(135deg,#3b7fff,#9d5cf6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-brand p{color:var(--text3);font-size:.83rem;margin-top:6px;letter-spacing:.01em;}

.login-card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:18px;padding:32px 28px;
  box-shadow:0 24px 64px rgba(0,0,0,.4);
}

/* Google Sign-In button */
.google-btn{
  width:100%;background:#fff;border:none;border-radius:10px;
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:12px;height:50px;font-family:var(--sans);font-size:.93rem;font-weight:600;
  color:#1f2937;transition:all .15s;box-shadow:0 2px 8px rgba(0,0,0,.2);
  text-decoration:none;
}
.google-btn:hover{box-shadow:0 4px 16px rgba(0,0,0,.3);transform:translateY(-1px);}
.google-btn:active{transform:scale(.98);}
.google-logo{width:22px;height:22px;flex-shrink:0;}

.divider-line{
  display:flex;align-items:center;gap:10px;
  margin:20px 0;color:var(--text3);font-size:.75rem;
}
.divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:var(--border);}

.status-box{
  border-radius:10px;padding:13px 16px;
  font-size:.82rem;line-height:1.6;text-align:center;margin-bottom:16px;
  display:none;
}
.status-box.loading{background:#0c1829;border:1px solid #1a3050;color:#7eb8f7;}
.status-box.error  {background:#1a0808;border:1px solid #5c1a1a;color:#fca5a5;}
.status-box.success{background:#061a0e;border:1px solid #0f3322;color:#4ade80;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text3);margin-bottom:6px;}
.field input{
  width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-family:var(--sans);font-size:.9rem;padding:10px 13px;outline:none;transition:border .15s;
}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--text3);}

.btn-login{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:var(--r-sm);padding:13px;font-family:var(--sans);
  font-size:.95rem;font-weight:700;cursor:pointer;
  transition:all .15s;letter-spacing:.01em;margin-bottom:12px;
  display:block;
}
.btn-login:hover{background:var(--accent-d);}
.btn-login:active{transform:scale(.98);}
.btn-setup{
  width:100%;background:transparent;border:1.5px solid var(--border);border-radius:var(--r-sm);
  color:var(--text2);font-family:var(--sans);font-size:.82rem;font-weight:500;
  padding:10px;cursor:pointer;transition:all .15s;margin-top:8px;
}
.btn-setup:hover{border-color:var(--border2);color:var(--text);}

/* Setup URL input (collapsed by default) */
#setup-section{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.btn-primary{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);
  padding:11px;font-family:var(--sans);font-size:.9rem;font-weight:700;
  cursor:pointer;transition:opacity .15s;
}
.btn-primary:hover{opacity:.88;}

/* User info row (shown after OAuth) */
.user-info-row{
  display:flex;align-items:center;gap:10px;
  background:var(--s2);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;margin-bottom:16px;display:none;
}
.user-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--border2);
}
.user-email{font-size:.8rem;color:var(--text2);}
.user-name-display{font-size:.88rem;font-weight:600;}

.security-note{
  margin-top:16px;text-align:center;font-size:.72rem;
  color:var(--text3);line-height:1.6;
  display:flex;align-items:flex-start;justify-content:center;gap:5px;
}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;}

.topbar{
  background:var(--s1);border-bottom:1px solid var(--border);
  height:54px;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:300;gap:10px;
}
.tl{display:flex;align-items:center;gap:9px;}
.tl-logo{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;
}
.tl-name{font-weight:800;font-size:.9rem;letter-spacing:-.01em;}
.role-tag{border-radius:20px;padding:3px 10px;font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;}
.role-tag.boss {background:#1a1500;color:var(--gold);border:1px solid #3a3000;}
.role-tag.agent{background:rgba(59,127,255,.12);color:var(--accent);border:1px solid rgba(59,127,255,.25);}

.tr{display:flex;align-items:center;gap:7px;}
.user-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--s2);border:1px solid var(--border);border-radius:20px;
  padding:3px 10px 3px 4px;font-size:.72rem;color:var(--text2);
}
.uc-avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0;
}
.sync-pill{
  display:flex;align-items:center;gap:5px;background:var(--s2);
  border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:.7rem;color:var(--text2);transition:all .3s;
}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-pill.syncing .sdot{background:var(--amber);animation:blink .6s infinite;}
.sync-pill.error   .sdot{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.icbtn{
  width:32px;height:32px;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r-sm);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .15s;flex-shrink:0;
}
.icbtn:hover{border-color:var(--proj,var(--accent));color:var(--proj,var(--accent));}

/* PROJECT TABS */
.ptabs{
  background:var(--s1);border-bottom:1px solid var(--border);
  padding:0 14px;display:flex;overflow-x:auto;scrollbar-width:none;
}
.ptabs::-webkit-scrollbar{display:none;}
.ptab{
  padding:10px 16px;font-size:.8rem;font-weight:700;color:var(--text2);
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.ptab:hover{color:var(--text);}
.ptab.active{color:var(--proj,var(--accent));border-bottom-color:var(--proj,var(--accent));}
.pcnt{background:var(--s2);border-radius:10px;padding:1px 7px;font-size:.67rem;font-weight:700;color:var(--text3);}
.ptab.active .pcnt{background:var(--proj,var(--accent));color:#fff;}

/* BOSS HEADER */
.boss-hd{
  background:linear-gradient(135deg,#100e00,#1a1600);
  border-bottom:1px solid #2a2200;
  padding:11px 14px;display:flex;align-items:center;gap:12px;
}
.boss-crown{font-size:1.3rem;}
.boss-title{font-weight:800;font-size:.93rem;color:var(--gold);}
.boss-sub{font-size:.73rem;color:#7a6a00;margin-top:1px;}
.boss-bar{
  background:var(--s1);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;align-items:center;gap:7px;
  overflow-x:auto;scrollbar-width:none;
}
.boss-bar::-webkit-scrollbar{display:none;}
.boss-bar-lbl{font-size:.66rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.afil{
  border-radius:20px;padding:4px 12px;font-size:.75rem;font-weight:700;
  cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);
  background:var(--s2);color:var(--text2);transition:all .15s;flex-shrink:0;
}
.afil:hover{color:var(--text);border-color:var(--border2);}
.afil.active{background:var(--gold);border-color:var(--gold);color:#111;}

/* MAIN */
.main{flex:1;padding:14px;max-width:760px;margin:0 auto;width:100%;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px;}
.stat{
  background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);
  padding:11px 8px;text-align:center;cursor:pointer;transition:border .15s;
}
.stat:hover,.stat.on{border-color:var(--proj,var(--accent));}
.stat-n{font-size:1.25rem;font-weight:800;line-height:1;}
.stat-l{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:2px;}

.toolbar{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
.sw{flex:1;min-width:150px;position:relative;}
.sw input{
  width:100%;background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font-family:var(--sans);font-size:.87rem;
  padding:8px 11px 8px 32px;outline:none;transition:border .15s;
}
.sw input:focus{border-color:var(--proj,var(--accent));}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.8rem;pointer-events:none;}
.add-btn{
  background:var(--proj,var(--accent));border:none;border-radius:var(--r-sm);
  color:#fff;font-family:var(--sans);font-size:.82rem;font-weight:700;
  padding:8px 14px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:5px;transition:opacity .15s;
}
.add-btn:hover{opacity:.87;}

.sscroll{overflow-x:auto;scrollbar-width:none;margin-bottom:10px;}
.sscroll::-webkit-scrollbar{display:none;}
.srow{display:flex;gap:5px;padding-bottom:2px;min-width:max-content;}
.stab{
  border-radius:6px;padding:4px 11px;font-size:.73rem;font-weight:700;
  cursor:pointer;border:1.5px solid transparent;white-space:nowrap;transition:all .15s;
}

.sort-row{display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.sort-lbl{font-size:.71rem;color:var(--text3);font-weight:600;}
.sort-sel{
  background:var(--s1);border:1.5px solid var(--border);border-radius:7px;
  color:var(--text2);font-family:var(--sans);font-size:.77rem;padding:5px 9px;outline:none;cursor:pointer;
}
.sort-sel:focus{border-color:var(--proj,var(--accent));}
.rcnt{margin-left:auto;font-size:.72rem;color:var(--text3);}

/* LEAD CARDS */
#leads{display:flex;flex-direction:column;gap:9px;}
.lcard{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border .15s;}
.lcard:hover{border-color:var(--border2);}
.lcard.open{border-color:var(--proj,var(--accent));}
.lcard.flash{animation:cf .7s ease-out;}
@keyframes cf{0%{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,185,84,.15);}100%{border-color:var(--border);box-shadow:none;}}

.agent-ribbon{
  background:var(--s2);border-bottom:1px solid var(--border);
  padding:4px 14px;font-size:.68rem;font-weight:700;
  display:flex;align-items:center;gap:6px;color:var(--text3);
}
.agent-av{
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:800;color:#fff;flex-shrink:0;
}

.lhead{padding:12px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;}
.linfo{flex:1;min-width:0;}
.lname{font-weight:700;font-size:.93rem;}
.lcontact{font-size:.78rem;color:var(--text2);margin-top:2px;}
.lright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}

.sbadge{border-radius:5px;padding:3px 10px;font-size:.71rem;font-weight:800;white-space:nowrap;letter-spacing:.02em;border:1.5px solid transparent;}
.s-NEW            {background:#fff;    color:#333;border-color:#ccc;}
.s-FOLLOW-UP      {background:#FFFF00; color:#333;border-color:#cccc00;}
.s-FOLLOW-UP-APPT {background:#92D050; color:#333;border-color:#6da030;}
.s-APPOINTMENT    {background:#FFC000; color:#333;border-color:#cc9900;}
.s-NO-ANSWER      {background:#D9D9D9; color:#555;border-color:#bbb;}
.s-NOT-INTERESTED {background:#D9D9D9; color:#555;border-color:#bbb;}
.s-PRANK-LEAD     {background:#FF0000; color:#fff;border-color:#cc0000;}
.s-LOAN-PROBLEM   {background:#D9D9D9; color:#555;border-color:#bbb;}
.s-OTHERS-LOCATION{background:#D9D9D9; color:#555;border-color:#bbb;}
.s-WRONG-NUMBER   {background:#D9D9D9; color:#555;border-color:#bbb;}

.ltimeline{border-top:1px solid var(--border);padding:9px 14px 6px;display:flex;flex-direction:column;gap:5px;}
.tl-row{display:flex;align-items:center;gap:7px;font-size:.71rem;}
.tl-icon{font-size:.82rem;width:18px;text-align:center;flex-shrink:0;}
.tl-label{color:var(--text3);font-weight:700;width:76px;flex-shrink:0;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;}
.tl-ago{border-radius:5px;padding:2px 7px;font-weight:700;font-size:.67rem;white-space:nowrap;}
.tl-ago.fresh {background:#061a0e;color:#1db954;border:1px solid #0f3322;}
.tl-ago.recent{background:#1f1608;color:#f0a500;border:1px solid #3d2e08;}
.tl-ago.stale {background:#1a0808;color:#e5363a;border:1px solid #3d1515;}
.tl-ago.none  {background:#131c2a;color:#3d5470;border:1px solid #1e2d45;}
.tl-date{color:var(--text3);font-size:.67rem;}

.lremarks{padding:7px 14px 10px;font-size:.79rem;color:var(--text2);line-height:1.6;border-top:1px solid var(--border);}
.lacts{padding:0 14px 11px;display:flex;gap:6px;flex-wrap:wrap;}
.abtn{
  background:var(--s2);border:1px solid var(--border);border-radius:7px;
  color:var(--text2);font-family:var(--sans);font-size:.76rem;font-weight:600;
  padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;
}
.abtn:hover{border-color:var(--proj,var(--accent));color:var(--proj,var(--accent));}
.abtn.cta{background:var(--proj,var(--accent));border-color:var(--proj,var(--accent));color:#fff;}
.abtn.cta:hover{opacity:.87;}

.upanel{border-top:1px solid var(--border);padding:13px 14px;background:#060c18;}
.upanel label{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:5px;}
.upanel select,.upanel textarea{
  width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;
  color:var(--text);font-family:var(--sans);font-size:.87rem;padding:8px 11px;outline:none;margin-bottom:11px;
}
.upanel select:focus,.upanel textarea:focus{border-color:var(--proj,var(--accent));}
.upanel select option{background:var(--bg);}
.upanel textarea{resize:vertical;min-height:60px;line-height:1.5;}
.urow{display:flex;gap:7px;}
.urow .abtn{flex:1;justify-content:center;padding:9px;font-size:.84rem;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-bg.hide{display:none;}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:24px 20px;width:100%;max-width:420px;}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:16px;}
.modal-row{display:flex;gap:8px;}
.modal-row .abtn{flex:1;justify-content:center;padding:10px;font-size:.88rem;}


/* CUSTOMER PROFILE */
.profile-section{border-top:1px solid var(--border);padding:10px 14px;background:linear-gradient(135deg,#0a1020,#0d1428);}
.profile-label{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--purple);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.profile-content{font-size:.82rem;color:var(--text2);line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.profile-empty{font-size:.8rem;color:var(--text3);font-style:italic;}
.profile-textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:.83rem;padding:9px 12px;resize:vertical;min-height:70px;outline:none;line-height:1.65;margin-top:6px;}
.profile-textarea:focus{border-color:var(--purple);}
.profile-edit-row{display:flex;gap:7px;margin-top:8px;}

.sbox{text-align:center;padding:52px 20px;color:var(--text2);}
.spin{width:30px;height:30px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.sbox-icon{font-size:2rem;margin-bottom:9px;}
.sbox-t{font-size:.9rem;font-weight:700;margin-bottom:4px;}
.sbox-s{font-size:.8rem;color:var(--text3);}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--s1);border:1px solid var(--border);border-radius:30px;padding:9px 18px;font-size:.81rem;opacity:0;pointer-events:none;transition:all .22s;z-index:999;white-space:nowrap;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 28px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok  {border-color:var(--green);color:var(--green);}
#toast.err {border-color:var(--red);  color:var(--red);}
#toast.inf {border-color:var(--accent);color:var(--accent);}
#toast.warn{border-color:var(--amber);color:var(--amber);}

@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .login-card{padding:24px 18px;}
  .tl-name{display:none;}
}

/* ── BLAST MODE ── */
.blast-bar{
  background:linear-gradient(135deg,#061a0e,#0a1f14);
  border-bottom:2px solid var(--wa);
  padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  position:sticky;top:54px;z-index:250;
}
.blast-bar.hide{display:none;}
.blast-count{
  background:var(--wa);color:#fff;border-radius:20px;
  padding:4px 12px;font-size:.8rem;font-weight:800;white-space:nowrap;
}
.blast-actions{display:flex;gap:7px;flex-wrap:wrap;flex:1;}
.bbtn{
  background:var(--s2);border:1.5px solid var(--border);border-radius:8px;
  color:var(--text2);font-family:var(--sans);font-size:.78rem;font-weight:700;
  padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all .15s;white-space:nowrap;
}
.bbtn:hover{border-color:var(--wa);color:var(--wa);}
.bbtn.wa{background:var(--wa);border-color:var(--wa);color:#fff;}
.bbtn.wa:hover{opacity:.87;}
.bbtn.cancel{background:#1a0808;border-color:#5c1a1a;color:var(--red);}
.bbtn.sel-all{background:var(--s3);border-color:var(--border2);}

/* Checkbox on lead cards */
.lcheck{
  width:20px;height:20px;border-radius:5px;border:2px solid var(--border);
  background:var(--s2);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;margin-top:2px;
}
.lcheck.checked{background:var(--wa);border-color:var(--wa);}
.lcheck.checked::after{content:'✓';color:#fff;font-size:.75rem;font-weight:800;}
.blast-mode .lcard{cursor:default;}
.blast-mode .lcard.selected{border-color:var(--wa);background:linear-gradient(135deg,#061a0e22,transparent);}

/* ── BLAST MODAL ── */
.blast-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;
  display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;
}
.blast-modal.hide{display:none;}
.blast-panel{
  background:var(--s1);border:1px solid var(--wa);border-radius:14px;
  padding:24px 20px;width:100%;max-width:500px;margin:auto;
}
.blast-panel h3{font-size:1rem;font-weight:800;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;color:var(--wa);}

/* Queue list */
.queue-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;margin-bottom:14px;}
.queue-item{
  background:var(--s2);border:1.5px solid var(--border);border-radius:9px;
  padding:11px 13px;display:flex;align-items:center;gap:10px;
}
.queue-item.sent{opacity:.45;border-color:var(--green);}
.queue-item.active{border-color:var(--wa);background:var(--wa-bg,#061a0e);}
.qi-info{flex:1;min-width:0;}
.qi-name{font-weight:700;font-size:.88rem;}
.qi-num{font-size:.76rem;color:var(--text2);}
.qi-msg{font-size:.75rem;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.qi-send{
  background:var(--wa);border:none;border-radius:7px;color:#fff;
  font-family:var(--sans);font-size:.78rem;font-weight:700;
  padding:7px 12px;cursor:pointer;white-space:nowrap;transition:opacity .15s;flex-shrink:0;
}
.qi-send:hover{opacity:.87;}
.qi-send:disabled{background:var(--s3);color:var(--text3);cursor:default;opacity:1;}

/* Countdown */
.countdown-wrap{
  background:var(--s2);border:1px solid var(--border);border-radius:10px;
  padding:14px;text-align:center;margin-bottom:14px;
}
.countdown-num{font-size:2.5rem;font-weight:800;color:var(--wa);line-height:1;}
.countdown-lbl{font-size:.78rem;color:var(--text2);margin-top:4px;}
.countdown-bar{
  height:5px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden;
}
.countdown-fill{height:100%;background:var(--wa);border-radius:3px;transition:width 1s linear;}

/* Progress */
.blast-progress{
  background:var(--s2);border-radius:8px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.bp-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.bp-fill{height:100%;background:var(--wa);border-radius:3px;transition:width .3s;}
.bp-lbl{font-size:.78rem;color:var(--text2);white-space:nowrap;}
</style>
</head>
<body>

<!-- ═══════════════════════ LOGIN ═══════════════════════ -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-icon">🏠</div>
      <h1>Property <em>CRM</em></h1>
      <p>Sign in with your username and password</p>
    </div>

    <div class="login-card">
        <div class="status-box" id="status-box"></div>

        <div class="field">
          <label>Username</label>
          <input id="login-username" type="text" placeholder="e.g. ahmad"
            autocomplete="username"
            onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()"/>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="login-password" type="password" placeholder="••••••••"
            autocomplete="current-password"
            onkeydown="if(event.key==='Enter') doLogin()"/>
        </div>

        <button class="btn-login" onclick="doLogin()">Sign In</button>

        <div class="security-note">
          🔒 Ask your boss for your username and password
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════ APP ═══════════════════════ -->
<div id="app">
  <div class="topbar">
    <div class="tl">
      <div class="tl-logo">🏠</div>
      <div class="tl-name" id="tl-name">CRM</div>
      <span class="role-tag" id="role-tag">Agent</span>
    </div>
    <div class="tr">
      <div class="sync-pill" id="spill"><div class="sdot"></div><span id="slbl">Synced</span></div>
      <div class="user-chip" id="user-chip">
        <div class="uc-avatar" id="uc-avatar">?</div>
        <span id="uc-name"></span>
      </div>
      <button class="icbtn" onclick="manualRefresh()" title="Refresh">🔄</button>
      <button class="icbtn" onclick="signOut()" title="Sign out">🔒</button>
    </div>
  </div>

  <!-- BLAST BAR -->
  <div class="blast-bar hide" id="blast-bar">
    <span class="blast-count" id="blast-count">0 selected</span>
    <div class="blast-actions">
      <button class="bbtn sel-all" onclick="selectAllVisible()">☑️ Select All Visible</button>
      <button class="bbtn" onclick="selectByStatus()">🔖 Select by Status</button>
      <button class="bbtn wa" onclick="openBlastModal()">💬 WhatsApp Blast</button>
      <button class="bbtn cancel" onclick="exitBlastMode()">✕ Cancel</button>
    </div>
  </div>

  <div id="boss-header" style="display:none;">
    <div class="boss-hd">
      <span class="boss-crown">👑</span>
      <div style="flex:1;">
        <div class="boss-title">Boss Dashboard</div>
        <div class="boss-sub" id="boss-sub">All agents · All projects</div>
      </div>
    </div>
    <div class="boss-bar">
      <span class="boss-bar-lbl">Agent</span>
      <div id="agent-pills" style="display:flex;gap:6px;"></div>
    </div>
  </div>

  <div class="ptabs" id="ptabs"></div>

  <div class="main">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="sw"><span class="si">🔍</span>
        <input id="search" placeholder="Search name, contact, remarks…" oninput="render()"/>
      </div>
      <button class="add-btn" id="add-btn" onclick="openAddModal()">➕ Add Lead</button>
      <button class="add-btn" id="blast-btn" onclick="toggleBlastMode()"
        style="background:var(--wa-d,#128C7E);">💬 Blast</button>
    </div>
    <div class="sscroll"><div class="srow" id="srow"></div></div>
    <div class="sort-row">
      <span class="sort-lbl">Sort</span>
      <select class="sort-sel" id="sort-sel" onchange="render()">
        <option value="default">Default</option>
        <option value="name">Name A–Z</option>
        <option value="status">Status</option>
        <option value="stale">Stale first</option>
      </select>
      <span class="rcnt" id="rcnt"></span>
    </div>
    <div id="leads"></div>
  </div>
</div>

<!-- ADD LEAD MODAL -->
<div class="modal-bg hide" id="add-modal">
  <div class="modal">
    <h3>➕ Add New Lead</h3>
    <div class="field"><label>Name</label><input id="m-name" type="text" placeholder="Mr / Ms / Name"/></div>
    <div class="field"><label>Contact</label><input id="m-contact" type="tel" placeholder="011-XXXX XXXX"/></div>
    <div class="field"><label>Status</label><select id="m-status"></select></div>
    <div class="field"><label>Remarks</label>
      <textarea id="m-remarks" placeholder="Initial notes…"
        style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;
        color:var(--text);font-family:var(--sans);font-size:.87rem;padding:9px 11px;resize:vertical;min-height:56px;outline:none;"></textarea>
    </div>
    <div class="field"><label>👤 Customer Profile (optional)</label>
      <textarea id="m-profile" placeholder="Free-form profile notes&#10;e.g. IC: 900101-XX | Income: RM5k | Budget: RM400k | Renting in Cheras"
        style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;
        color:var(--text);font-family:var(--sans);font-size:.87rem;padding:9px 11px;resize:vertical;min-height:56px;outline:none;"></textarea>
    </div>
    <div class="modal-row">
      <button class="abtn cta" onclick="submitAddLead()">Save to Sheet</button>
      <button class="abtn" onclick="document.getElementById('add-modal').classList.add('hide')">Cancel</button>
    </div>
  </div>
</div>

<!-- BLAST MODAL -->
<div class="blast-modal hide" id="blast-modal">
  <div class="blast-panel">
    <h3>💬 WhatsApp Blast
      <span style="font-size:.75rem;font-weight:500;color:var(--text2);margin-left:auto;" id="blast-modal-count"></span>
    </h3>

    <!-- Message composer -->
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px;">
        Message (use {{name}} for client name)
      </label>
      <textarea id="blast-msg" placeholder="Hi {{name}}, I'm following up on your property enquiry. Are you still interested? 😊"
        style="width:100%;background:var(--bg);border:1.5px solid var(--wa);border-radius:8px;
        color:var(--text);font-family:var(--sans);font-size:.87rem;padding:10px 12px;
        resize:vertical;min-height:80px;outline:none;line-height:1.6;"></textarea>
    </div>

    <!-- Mode selector -->
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="bbtn" id="mode-auto" onclick="setBlastMode('auto')"
        style="flex:1;justify-content:center;border-color:var(--wa);color:var(--wa);">⚡ Auto (with timer)</button>
      <button class="bbtn" id="mode-queue" onclick="setBlastMode('queue')"
        style="flex:1;justify-content:center;">📋 Queue (manual)</button>
    </div>

    <!-- Auto mode settings -->
    <div id="auto-settings" style="background:var(--s2);border-radius:9px;padding:12px;margin-bottom:14px;">
      <label style="font-size:.72rem;font-weight:700;color:var(--text3);display:block;margin-bottom:8px;">⏱ Delay between messages</label>
      <div style="display:flex;gap:7px;flex-wrap:wrap;">
        <button class="bbtn" id="delay-60"  onclick="setDelay(60)"  style="font-size:.8rem;">1 min</button>
        <button class="bbtn" id="delay-120" onclick="setDelay(120)" style="border-color:var(--wa);color:var(--wa);font-size:.8rem;">2 min ✓</button>
        <button class="bbtn" id="delay-180" onclick="setDelay(180)" style="font-size:.8rem;">3 min</button>
        <button class="bbtn" id="delay-300" onclick="setDelay(300)" style="font-size:.8rem;">5 min</button>
        <div style="display:flex;align-items:center;gap:5px;">
          <input id="delay-custom" type="number" min="1" max="60" placeholder="?"
            style="width:52px;background:var(--bg);border:1.5px solid var(--border);border-radius:6px;
            color:var(--text);font-family:var(--sans);font-size:.82rem;padding:5px 8px;outline:none;text-align:center;"
            oninput="setDelay(parseInt(this.value)*60||120)"/>
          <span style="font-size:.75rem;color:var(--text3);">min</span>
        </div>
      </div>
    </div>

    <!-- Countdown (shown during auto blast) -->
    <div class="countdown-wrap hide" id="countdown-wrap">
      <div class="countdown-num" id="countdown-num">120</div>
      <div class="countdown-lbl" id="countdown-lbl">Next message in...</div>
      <div class="countdown-bar"><div class="countdown-fill" id="countdown-fill" style="width:100%;"></div></div>
    </div>

    <!-- Progress -->
    <div class="blast-progress hide" id="blast-progress">
      <div class="bp-bar"><div class="bp-fill" id="bp-fill" style="width:0%;"></div></div>
      <span class="bp-lbl" id="bp-lbl">0 / 0 sent</span>

    <!-- Queue list -->
    <div class="queue-list" id="queue-list"></div>

    <!-- Action buttons -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="bbtn wa" id="blast-start-btn" onclick="startBlast()" style="flex:1;justify-content:center;padding:11px;">
        💬 Start Blast
      </button>
      <button class="bbtn" id="blast-pause-btn" onclick="pauseBlast()" style="display:none;flex:1;justify-content:center;padding:11px;">
        ⏸ Pause
      </button>
      <button class="bbtn cancel" onclick="closeBlastModal()" style="padding:11px;">✕ Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// Projects loaded dynamically from agent's sheet tabs
// No hardcoding needed — agent adds tabs freely
let PROJECTS = [];  // filled by loadProjects()

function makeProjectMeta(name, idx) {
  const emojis  = ['🏢','🏗','🏘','🌿','🏙','🏬','🌆','🏦'];
  const classes = ['p0','p1','p2','p3','p0','p1','p2','p3'];
  // Shorten label: take first word or first 6 chars
  const label = name.replace(/new customer /i,'').split(' ')[0].slice(0,8).toUpperCase();
  return { name, label, emoji: emojis[idx%8], cls: classes[idx%8] };
}

const STATUSES=[
  "NEW","FOLLOW UP","FOLLOW UP APPT","APPOINTMENT",
  "NO ANSWER","NOT INTERESTED","PRANK LEAD",
  "LOAN PROBLEM","OTHERS LOCATION","WRONG NUMBER"
];

const STAB_STYLE={
  "All":["#1e2d45","#8fa3be"],
  "NEW":["#e5e7eb","#333"],"FOLLOW UP":["#FFFF00","#333"],
  "FOLLOW UP APPT":["#92D050","#333"],"APPOINTMENT":["#FFC000","#333"],
  "NO ANSWER":["#D9D9D9","#555"],"NOT INTERESTED":["#D9D9D9","#555"],
  "PRANK LEAD":["#FF0000","#fff"],"LOAN PROBLEM":["#D9D9D9","#555"],
  "OTHERS LOCATION":["#D9D9D9","#555"],"WRONG NUMBER":["#D9D9D9","#555"],
};

// ── STATE ────────────────────────────────────────────────────
let masterUrl       = 'https://script.google.com/macros/s/AKfycby6qZj-DspeFyVuGx-CxOT1QzOYcEfc6C5vtOjJZWqr2YS_vqMZHYAtkC2rCXMVn2ps/exec';

// ── CACHE CONFIG ─────────────────────────────────────────────
const CACHE_KEY     = u => 'crm_cache_' + u;
const CACHE_MAX_AGE = 5 * 60 * 1000;  // 5 minutes
const POLL_MS       = 10 * 60 * 1000; // poll every 10 minutes for boss

function saveCache(username, data) {
  try { localStorage.setItem(CACHE_KEY(username), JSON.stringify({ data, ts: Date.now() })); } catch(e){}
}
function loadCache(username) {
  try {
    const raw = localStorage.getItem(CACHE_KEY(username));
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > CACHE_MAX_AGE) return null; // stale
    return data;
  } catch(e){ return null; }
}
let currentUser     = null;   // {name,username,role,scriptUrl,color}
// Fallback agent list — empty, always use master sheet as source of truth
const FALLBACK_AGENTS = [];
let agentList       = [];
let agentLeads      = {};     // {agentName:{projName:[leads]}}
let prevSnap        = {};
let activeProjIdx   = 0;
let activeStatus    = 'All';
let activeAgentFil  = 'All';
let openId          = null;
let pollTimer       = null;

// ═══════════════════════════════════════════════════════════════
//  USERNAME / PASSWORD LOGIN
// ═══════════════════════════════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('login-username').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value.trim();

  if (!username || !password) {
    showStatus('Please enter both username and password.', 'error');
    return;
  }

  showStatus('Signing in…', 'loading');
  console.log('Attempting login for:', username, 'via', masterUrl);

  const MASTER = 'https://script.google.com/macros/s/AKfycby6qZj-DspeFyVuGx-CxOT1QzOYcEfc6C5vtOjJZWqr2YS_vqMZHYAtkC2rCXMVn2ps/exec';
  const url = MASTER + '?action=login'
    + '&username=' + encodeURIComponent(username)
    + '&password=' + encodeURIComponent(password)
    + '&t=' + Date.now();

  let data = null;
  let lastError = '';

  // Try multiple fetch attempts
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      console.log('Attempt', attempt, url);
      const res  = await Promise.race([
        fetch(url, { redirect: 'follow' }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 10000))
      ]);
      const text = await res.text();
      console.log('Response:', text.slice(0, 200));
      // Parse JSON — handle Google's redirect wrapper
      try { data = JSON.parse(text); break; }
      catch(e) {
        const match = text.match(/\{[\s\S]*"authenticated"[\s\S]*\}/);
        if (match) { data = JSON.parse(match[0]); break; }
      }
    } catch(e) {
      lastError = e.message;
      console.warn('Attempt', attempt, 'failed:', e.message);
      if (attempt < 3) await new Promise(r => setTimeout(r, 1000));
    }
  }

  if (!data) {
    showStatus('Cannot reach CRM server (' + lastError + '). Check internet and try again.', 'error');
    return;
  }
  if (!data.authenticated) {
    showStatus(data.error || 'Login failed. Check username and password.', 'error');
    return;
  }

  currentUser = {
    name:      data.name || username,
    username,
    role:      data.role || 'agent',
    scriptUrl: data.scriptUrl || '',
    color:     data.color || '#3b7fff',
  };
  localStorage.setItem('crm_session', JSON.stringify({ ...currentUser, masterUrl: MASTER, ts: Date.now() }));
  showStatus('Welcome, ' + currentUser.name + '! Loading…', 'success');
  setTimeout(startApp, 400);
}

function showStatus(msg, type) {
  const el = document.getElementById('status-box');
  el.textContent = msg;
  el.className   = 'status-box ' + type;
  el.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════
//  SETUP URL
// ═══════════════════════════════════════════════════════════════


function signOut() {
  clearInterval(pollTimer);
  currentUser = null; agentLeads = {}; prevSnap = {};
  openId = null; activeProjIdx = 0; activeStatus = 'All'; activeAgentFil = 'All';
  localStorage.removeItem('crm_session');
  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('app').style.display          = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('status-box').style.display    = 'none';
  document.getElementById('boss-header').style.display   = 'none';
}

// ═══════════════════════════════════════════════════════════════
//  DYNAMIC PROJECT LOADING
// ═══════════════════════════════════════════════════════════════
async function loadProjects(agent) {
  const url = agent.scriptUrl + '?action=getProjects&t=' + Date.now();
  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (data.projects && data.projects.length) {
      PROJECTS = data.projects.map((p, i) => makeProjectMeta(p.name, i));
      buildProjTabs();
      buildStatusFilters();
    }
  } catch(e) { console.error('loadProjects:', e); }
}

// ═══════════════════════════════════════════════════════════════
//  APP START
// ═══════════════════════════════════════════════════════════════
async function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display          = 'flex';

  const isBoss = currentUser.role === 'boss';
  document.body.className = isBoss ? 'role-boss' : 'role-agent p0';
  document.getElementById('tl-name').textContent       = currentUser.name;
  document.getElementById('role-tag').textContent      = isBoss ? '👑 Boss' : '👤 Agent';
  document.getElementById('role-tag').className        = 'role-tag ' + (isBoss ? 'boss' : 'agent');
  document.getElementById('uc-name').textContent       = currentUser.name.split(' ')[0];
  document.getElementById('uc-avatar').textContent     = currentUser.name[0].toUpperCase();
  document.getElementById('uc-avatar').style.background= currentUser.color;
  document.getElementById('add-btn').style.display     = isBoss ? 'none' : 'flex';

  buildProjTabs();
  buildStatusFilters();
  buildModalStatuses();

  if (isBoss) {
    document.getElementById('boss-header').style.display = 'block';
    // Boss sees all agents — load projects from first agent with a scriptUrl
    const firstAgent = agentList.find(a => a.scriptUrl);
    if (firstAgent) await loadProjects(firstAgent);
    fetchAllAgents();
  } else {
    // Agent — show cache instantly, sync in background
    const cached = loadCache(currentUser.username);
    if (cached && cached.agentLeads) {
      agentLeads = cached.agentLeads;
      if (cached.projects && cached.projects.length) {
        PROJECTS = cached.projects;
        buildProjTabs();
        buildStatusFilters();
      }
      fullRender();
      setSyncUI('ok', 'Cached · ' + (cached.time||''));
    }
    // Always sync fresh in background (silent if cache shown)
    loadProjects(currentUser).then(() => {
      fetchAgentLeads(currentUser, !!cached);
    });
  }
  startPolling();
}

// ═══════════════════════════════════════════════════════════════
//  FETCH
// ═══════════════════════════════════════════════════════════════
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (currentUser.role === 'boss') fetchAllAgents();
    else fetchAgentLeads(currentUser, false);
  }, POLL_MS);
}
function manualRefresh() {
  if (currentUser.role === 'boss') fetchAllAgents();
  else {
    loadProjects(currentUser).then(() => fetchAgentLeads(currentUser, false));
  }
}

async function fetchAllAgents() {

  // Step 1 — Show cache instantly if available
  const cached = loadCache('boss_' + currentUser.username);
  if (cached) {
    agentLeads = cached.agentLeads || {};
    if (cached.agentList && cached.agentList.length) agentList = cached.agentList;
    buildBossAgentFilter();
    fullRender();
    setSyncUI('ok', 'Cached · ' + cached.time);
  } else {
    // No cache — show all known agents immediately with 0 leads
    buildBossAgentFilter();
    fullRender();
    setSyncUI('syncing', 'Loading…');
  }

  // Step 2 — Fetch agent list from master (5s timeout)
  try {
    const res  = await fetchWithTimeout(masterUrl + '?action=getAllAgents&username=' + encodeURIComponent(currentUser.username) + '&t=' + Date.now(), 5000);
    const data = await res.json();
    if (data.agents) {
      const fromMaster = data.agents.filter(a => a.role !== 'boss');
      const masterNames = new Set(fromMaster.map(a => a.name.toLowerCase()));
      const extra = FALLBACK_AGENTS.filter(a => !masterNames.has(a.name.toLowerCase()));
      agentList = [...fromMaster, ...extra];
    }
  } catch(e) {
    console.warn('Master fetch failed, using fallback:', e.message);
  }
  if (agentList.length === 0) agentList = FALLBACK_AGENTS;

  // Step 3 — Filter only agents with valid script URLs
  const activeAgents = agentList.filter(a =>
    a.scriptUrl && a.scriptUrl.includes('script.google.com')
  );

  buildBossAgentFilter();

  if (activeAgents.length === 0) {
    setSyncUI('ok', 'No agent sheets linked yet');
    fullRender();
    return;
  }

  // Step 4 — Load projects from first active agent (3s timeout)
  try {
    await Promise.race([
      loadProjects(activeAgents[0]),
      new Promise(r => setTimeout(r, 3000))
    ]);
  } catch(e) { console.warn('loadProjects failed:', e.message); }

  // Step 5 — Fetch ALL agents in PARALLEL with strict 8s timeout each
  setSyncUI('syncing', 'Syncing ' + activeAgents.length + ' agent' + (activeAgents.length > 1 ? 's' : '') + '…');
  await Promise.allSettled(
    activeAgents.map(agent => fetchAgentLeadsParallel(agent))
  );

  // Step 6 — Save cache + render
  saveCache('boss_' + currentUser.username, { agentLeads, agentList, time: nowTime() });
  buildBossAgentFilter();
  fullRender();
  setSyncUI('ok', 'Synced ' + nowTime());
}

// Fetch with timeout to prevent hanging on slow agents
function fetchWithTimeout(url, ms=8000) {
  return Promise.race([
    fetch(url, { redirect: 'follow' }),
    new Promise((_,reject) => setTimeout(()=>reject(new Error('Timeout after '+ms+'ms')), ms))
  ]);
}

// Parallel version — doesn't block others if one fails
async function fetchAgentLeadsParallel(agent) {
  if (!agent.scriptUrl || !agent.scriptUrl.includes('script.google.com')) return;
  try {
    const res  = await fetchWithTimeout(agent.scriptUrl + '?action=getAllLeads&t=' + Date.now(), 10000);
    const data = await res.json();
    if (data.error) return;

    if (!agentLeads[agent.name]) agentLeads[agent.name] = {};
    const allLeadsData = data.allLeads || {};
    Object.keys(allLeadsData).forEach(projName => {
      const incoming = allLeadsData[projName] || [];
      incoming.forEach(l => { l.agentName = agent.name; l.agentColor = agent.color || '#3b7fff'; });
      agentLeads[agent.name][projName] = incoming;
    });
    buildSnap();
  } catch(e) {
    console.warn('Skip agent (timeout/error):', agent.name);
  }
}

async function fetchAgentLeads(agent, silent) {
  if (!agent.scriptUrl || !agent.scriptUrl.includes('script.google.com')) return;
  if (!silent) setSyncUI('syncing','Syncing…');

  try{
    // Use getAllLeads to get ALL tabs at once — no project name needed
    const res = await fetchWithTimeout(
      agent.scriptUrl + '?action=getAllLeads&t=' + Date.now(), 10000
    );
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    if(!agentLeads[agent.name]) agentLeads[agent.name] = {};

    // Store leads per project
    const allLeadsData = data.allLeads || {};
    Object.keys(allLeadsData).forEach(projName => {
      const incoming = allLeadsData[projName] || [];
      incoming.forEach(l => {
        l.agentName  = agent.name;
        l.agentColor = agent.color || '#3b7fff';
      });
      const changed = detectChanges(agent.name, projName, incoming);
      agentLeads[agent.name][projName] = incoming;
      if(!silent && changed.length) toast(changed.length + ' updated', 'inf');
    });

    buildSnap();

    // Save to cache for instant load next time
    if (currentUser.role !== 'boss') {
      saveCache(currentUser.username, {
        agentLeads,
        projects: PROJECTS,
        time: nowTime()
      });
    }

    if(!silent){
      fullRender();
      setSyncUI('ok', 'Synced ' + nowTime());
    }
  }catch(e){
    // Fallback: try fetching current project only
    try{
      const proj = PROJECTS[activeProjIdx] || PROJECTS[0];
      if(!proj) return;
      const res2 = await fetchWithTimeout(
        agent.scriptUrl + '?action=getLeads&sheet=' + encodeURIComponent(proj.name) + '&t=' + Date.now(), 8000
      );
      const data2 = await res2.json();
      if(!data2.error){
        const incoming = data2.leads || [];
        incoming.forEach(l => { l.agentName=agent.name; l.agentColor=agent.color||'#3b7fff'; });
        if(!agentLeads[agent.name]) agentLeads[agent.name]={};
        agentLeads[agent.name][proj.name] = incoming;
        buildSnap();
      }
    }catch(e2){ console.error('fetchAgentLeads fallback failed:', agent.name, e2); }
    if(!silent){ setSyncUI('error','Sync failed'); }
  }
}

function detectChanges(aName,pName,incoming){
  return incoming.filter(l=>{
    const prev=prevSnap[aName+':'+pName+':'+l.id];
    return prev&&(prev.status!==l.status||prev.remarks!==l.remarks);
  }).map(l=>l.id);
}
function buildSnap(){
  prevSnap={};
  Object.keys(agentLeads).forEach(a=>Object.keys(agentLeads[a]).forEach(p=>{
    (agentLeads[a][p]||[]).forEach(l=>{ prevSnap[a+':'+p+':'+l.id]={status:l.status,remarks:l.remarks}; });
  }));
}

function getVisible(){
  const isBoss = currentUser.role === 'boss';
  const proj   = PROJECTS[activeProjIdx];
  let leads    = [];

  if(isBoss){
    const agents = activeAgentFil === 'All'
      ? agentList
      : agentList.filter(a => a.name === activeAgentFil);

    if(proj){
      // Show leads for the selected project tab
      agents.forEach(a => {
        leads = leads.concat((agentLeads[a.name]||{})[proj.name]||[]);
      });
    } else {
      // No project selected — show all leads from all projects
      agents.forEach(a => {
        const aData = agentLeads[a.name] || {};
        Object.values(aData).forEach(projLeads => {
          leads = leads.concat(projLeads || []);
        });
      });
    }
  } else {
    // Agent sees their own project
    leads = proj ? (agentLeads[currentUser.name]||{})[proj.name]||[] : [];
  }
  return leads;
}

  if(sortBy==='status') leads.sort((a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status));

        </div>

      </div>

function toggle(id){ openId=(openId===id)?null:id; render();

function doSave(id,rowIndex){

async function saveProfile(id, rowIndex){
  const proj    = PROJECTS[activeProjIdx];
  const textarea= document.getElementById('prof-'+id);
  if(!textarea) return;
  const profile = textarea.value;
  const lead    = ((agentLeads[currentUser.name]||{})[proj.name]||[]).find(l=>l.id===id);
  if(lead) lead.profile = profile;
  render();
  if(!currentUser.scriptUrl){ toast('Profile saved (local only)','warn'); return; }
  setSyncUI('syncing','Saving profile…');
  try{
    const url = currentUser.scriptUrl
      + '?action=updateLead'
      + '&rowIndex=' + rowIndex
      + '&sheet=' + encodeURIComponent(proj.name)
      + '&status=' + encodeURIComponent(lead?.status||'NEW')
      + '&profile=' + encodeURIComponent(profile)
      + '&agent=' + encodeURIComponent(currentUser.name)
      + '&t=' + Date.now();
    const res  = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    setSyncUI('ok','Profile saved '+nowTime());
    toast('Customer profile saved ✅','ok');
    const card = document.getElementById('c-'+id);
    if(card){ card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'),800); }
  }catch(e){ setSyncUI('error','Save failed'); toast('Save failed: '+e.message,'err'); }
}

// ═══════════════════════════════════════════════════════════════
//  WRITE BACK
// ═══════════════════════════════════════════════════════════════
async function saveLead(id,rowIndex,status,newRemark){
  const proj=PROJECTS[activeProjIdx];
  const lead=((agentLeads[currentUser.name]||{})[proj.name]||[]).find(l=>l.id===id);
  const prev=lead?lead.status:'';
  const nowDT=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const nowStr=pad(nowDT.getDate())+'/'+pad(nowDT.getMonth()+1)+'/'+nowDT.getFullYear()+' '+pad(nowDT.getHours())+':'+pad(nowDT.getMinutes());
  if(lead){
    if(prev!==status){ lead.status=status; lead.tsStatus=nowStr+' ['+currentUser.name+'] '+prev+'→'+status; }
    if(newRemark&&newRemark.trim()){
      const entry=nowDT.getDate()+'/'+(nowDT.getMonth()+1)+' ['+currentUser.name+'] '+newRemark.trim();
      lead.remarks=lead.remarks?lead.remarks+' | '+entry:entry;
      lead.tsRemark=nowStr;
    }
  }
  openId=null; fullRender();
  if(!currentUser.scriptUrl){ toast('Updated (no script configured)','warn'); return; }
  setSyncUI('syncing','Saving…');
  try{
    // Use GET to avoid CORS issues
    const getUrl = currentUser.scriptUrl
      + '?action=updateLead'
      + '&rowIndex=' + rowIndex
      + '&sheet=' + encodeURIComponent(proj.name)
      + '&status=' + encodeURIComponent(status)
      + '&newRemark=' + encodeURIComponent(newRemark||'')
      + '&agent=' + encodeURIComponent(currentUser.name)
      + '&t=' + Date.now();
    const res=await fetch(getUrl);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    buildSnap(); setSyncUI('ok','Saved '+nowTime());
    toast((lead?.name||'Lead')+' → '+status,'ok');
    const card=document.getElementById('c-'+id);
    if(card){ card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'),800); }
  }catch(e){ if(lead) lead.status=prev; setSyncUI('error','Save failed'); toast('Save failed: '+e.message,'err'); fullRender(); }
}

function callLead(id,rowIndex,contact,agentName){
  if(!contact||contact==='—') return;
  window.open('tel:'+contact.replace(/\s/g,''));
  logAction(id,rowIndex,agentName,'logCall','tsCall');
}
function waLead(id,rowIndex,contact,name,agentName){
  if(!contact||contact==='—') return;
  const clean=contact.replace(/[\s\-]/g,'');
  const num=clean.startsWith('0')?'6'+clean:clean;
  const msg=encodeURIComponent('Hi '+(name||'')+", I'm "+currentUser.name+' from the property team. Following up on your enquiry. Are you still interested? 😊');
  window.open('https://wa.me/'+num+'?text='+msg);
  logAction(id,rowIndex,agentName,'logWhatsApp','tsWa');
}
async function logAction(leadId,rowIndex,agentName,action,tsField){
  const proj=PROJECTS[activeProjIdx];
  const aName=agentName||currentUser.name;
  const lead=((agentLeads[aName]||{})[proj.name]||[]).find(l=>l.id===leadId);
  const nowDT=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const nowStr=pad(nowDT.getDate())+'/'+pad(nowDT.getMonth()+1)+'/'+nowDT.getFullYear()+' '+pad(nowDT.getHours())+':'+pad(nowDT.getMinutes());
  if(lead) lead[tsField]=nowStr;
  render();
  const url=currentUser.role==='boss'?(agentList.find(a=>a.name===aName)||{}).scriptUrl:currentUser.scriptUrl;
  if(!url) return;
  try{
    // Use GET to avoid CORS issues with Google Apps Script
    const getUrl = url
      + '?action=' + action
      + '&rowIndex=' + rowIndex
      + '&sheet=' + encodeURIComponent(proj.name)
      + '&agent=' + encodeURIComponent(currentUser.name)
      + '&t=' + Date.now();
    await fetch(getUrl);
    buildSnap();
  }catch(e){ console.error('logAction:',e); }
}

    const getUrl = currentUser.scriptUrl
      + '?action=addLead'
      + '&sheet=' + encodeURIComponent(proj.name)
      + '&name=' + encodeURIComponent(name||'')
      + '&contact=' + encodeURIComponent(contact||'')
      + '&status=' + encodeURIComponent(status||'NEW')
      + '&remarks=' + encodeURIComponent(remarks||'')
      + '&profile=' + encodeURIComponent(profile||'')
      + '&t=' + Date.now();
    const res=await fetch(getUrl);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    toast((name||contact)+' added ✅','ok');
    await fetchAgentLeads(currentUser,false);
  }catch(e){ setSyncUI('error','Add failed'); toast('Add failed: '+e.message,'err'); }
}

// ═══════════════════════════════════════════════════════════════
//  ACTIVITY TIMELINE
// ═══════════════════════════════════════════════════════════════
function activityBlock(lead){
  const rows=[
    {icon:'🔖',label:'Status',   val:lead.tsStatus},
    {icon:'📝',label:'Remark',   val:lead.tsRemark},
    {icon:'📞',label:'Last Call',val:lead.tsCall},
    {icon:'💬',label:'WhatsApp', val:lead.tsWa},
  ];
  if(!rows.some(r=>r.val&&r.val!=='—')) return '';
  return '<div class="ltimeline">'+rows.map(r=>{
    const {label:ago,cls}=timeAgo(r.val);
    const ds=r.val&&r.val!=='—'?fmtShort(r.val):'';
    return '<div class="tl-row"><span class="tl-icon">'+r.icon+'</span><span class="tl-label">'+r.label+'</span>'+
      '<span class="tl-ago '+cls+'">'+ago+'</span>'+(ds?'<span class="tl-date">'+ds+'</span>':'')+
    '</div>';
  }).join('')+'</div>';
}

// ═══════════════════════════════════════════════════════════════
//  TIME HELPERS
// ═══════════════════════════════════════════════════════════════
function timeAgo(str){
  if(!str||str==='—') return {label:'—',cls:'none'};
  const m=String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return {label:'—',cls:'none'};
  const d=new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const diff=Math.floor((Date.now()-d)/60000);
  if(diff<1)   return {label:'Just now',cls:'fresh'};
  if(diff<60)  return {label:diff+'m ago',cls:'fresh'};
  if(diff<1440)return {label:Math.floor(diff/60)+'h ago',cls:'fresh'};
  const days=Math.floor(diff/1440);
  if(days===1) return {label:'Yesterday',cls:'recent'};
  if(days<=3)  return {label:days+' days ago',cls:'recent'};
  return {label:days+' days ago',cls:'stale'};
}
function fmtShort(str){
  if(!str||str==='—') return '';
  const m=String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return str.slice(0,16);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return +m[1]+' '+months[+m[2]-1]+', '+(m[4]||'00')+':'+(m[5]||'00');
}
function staleness(lead){
  const ts=lead.tsStatus||lead.tsRemark||lead.tsCall||lead.tsWa||'';
  if(!ts||ts==='—') return 999999;
  const m=String(ts).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(!m) return 999998;
  const d=new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  return Math.floor((Date.now()-d)/60000);
}

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
// Fix scientific notation phone numbers (e.g. 6.01135E+11 → 60113500000)
function formatContact(contact) {
  if (!contact || contact === '—') return contact;
  const s = String(contact).trim();
  // Detect scientific notation
  if (/^\d+\.?\d*[eE]\+\d+$/.test(s)) {
    try {
      const num = Math.round(parseFloat(s));
      return String(num);
    } catch(e) {}
  }
  return s;
}

function setSyncUI(s,l){ document.getElementById('spill').className='sync-pill '+s; document.getElementById('slbl').textContent=l; }
let _tt;
function toast(msg,type='ok'){
  const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show '+type;
  clearTimeout(_tt); _tt=setTimeout(()=>{ el.className='toast'; },3200);
}
function nowTime(){ return new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ═══════════════════════════════════════════════════════════════
//  WHATSAPP BLAST
// ═══════════════════════════════════════════════════════════════
let blastMode    = false;
let selectedIds  = new Set();
let blastQueue   = [];
let blastDelay   = 120;       // seconds between messages
let blastRunning = false;
let blastPaused  = false;
let blastIdx     = 0;
let countdownTimer = null;
let countdownSec   = 0;
let blastModeType  = 'auto';  // 'auto' | 'queue'

function toggleBlastMode() {
  blastMode = !blastMode;
  selectedIds.clear();
  document.getElementById('blast-bar').classList.toggle('hide', !blastMode);
  document.body.classList.toggle('blast-mode', blastMode);
  document.getElementById('blast-btn').style.background = blastMode ? 'var(--red)' : 'var(--wa-d,#128C7E)';
  document.getElementById('blast-btn').textContent = blastMode ? '✕ Exit Blast' : '💬 Blast';
  render();
}

function exitBlastMode() {
  blastMode = false; selectedIds.clear();
  document.getElementById('blast-bar').classList.add('hide');
  document.body.classList.remove('blast-mode');
  document.getElementById('blast-btn').style.background = 'var(--wa-d,#128C7E)';
  document.getElementById('blast-btn').textContent = '💬 Blast';
  render();
}

function toggleSelect(id) {
  if (!blastMode) return;
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  updateBlastCount();
  // Update card visual
  const card = document.getElementById('c-' + id);
  if (card) card.classList.toggle('selected', selectedIds.has(id));
  const chk = document.getElementById('chk-' + id);
  if (chk) chk.classList.toggle('checked', selectedIds.has(id));
}

function selectAllVisible() {
  const leads = getVisible();
  const q     = document.getElementById('search').value.toLowerCase();
  let visible = leads;
  if (activeStatus !== 'All') visible = visible.filter(l => l.status === activeStatus);
  if (q) visible = visible.filter(l => [l.name,l.contact,l.remarks].some(v=>(v||'').toLowerCase().includes(q)));
  visible.forEach(l => selectedIds.add(l.id));
  updateBlastCount();
  render();
}

function selectByStatus() {
  // Show quick status picker
  const statuses = STATUSES;
  const picked   = prompt('Enter status to select all (e.g. FOLLOW UP):\n\n' + statuses.join('\n'));
  if (!picked) return;
  const upper  = picked.trim().toUpperCase();
  const leads  = getVisible().filter(l => l.status === upper);
  if (!leads.length) { toast('No leads with status: ' + upper, 'warn'); return; }
  leads.forEach(l => selectedIds.add(l.id));
  updateBlastCount();
  render();
  toast(leads.length + ' leads selected (' + upper + ')', 'ok');
}

function updateBlastCount() {
  const n = selectedIds.size;
  document.getElementById('blast-count').textContent = n + ' selected';
  document.getElementById('blast-bar').classList.toggle('hide', false);
}

// ── BLAST MODAL ──────────────────────────────────────────────
function openBlastModal() {
  if (selectedIds.size === 0) { toast('Please select at least one lead first', 'err'); return; }
  buildBlastQueue();
  document.getElementById('blast-modal-count').textContent = selectedIds.size + ' recipients';
  document.getElementById('blast-modal').classList.remove('hide');
  document.getElementById('countdown-wrap').classList.add('hide');
  document.getElementById('blast-progress').classList.add('hide');
  document.getElementById('blast-start-btn').style.display = 'flex';
  document.getElementById('blast-pause-btn').style.display = 'none';
  blastRunning = false; blastPaused = false; blastIdx = 0;
  setBlastMode('auto');
  setDelay(120);
  renderQueue();
}

function closeBlastModal() {
  stopCountdown();
  blastRunning = false; blastPaused = false;
  document.getElementById('blast-modal').classList.add('hide');
}

function setBlastMode(mode) {
  blastModeType = mode;
  document.getElementById('mode-auto').style.borderColor  = mode==='auto' ? 'var(--wa)' : '';
  document.getElementById('mode-auto').style.color        = mode==='auto' ? 'var(--wa)' : '';
  document.getElementById('mode-queue').style.borderColor = mode==='queue'? 'var(--wa)' : '';
  document.getElementById('mode-queue').style.color       = mode==='queue'? 'var(--wa)' : '';
  document.getElementById('auto-settings').style.display  = mode==='auto' ? 'block' : 'none';
}

function setDelay(secs) {
  blastDelay = secs || 120;
  ['60','120','180','300'].forEach(s => {
    const btn = document.getElementById('delay-' + s);
    if (btn) { btn.style.borderColor = s == secs ? 'var(--wa)' : ''; btn.style.color = s == secs ? 'var(--wa)' : ''; }
  });
}

function buildBlastQueue() {
  const allLeads = getVisible();
  blastQueue = [];
  selectedIds.forEach(id => {
    const lead = allLeads.find(l => l.id === id);
    if (lead && lead.contact && lead.contact !== '—') blastQueue.push(lead);
  });
}

function renderQueue() {
  const msg   = document.getElementById('blast-msg').value || 'Hi {{name}}, following up on your property enquiry 😊';
  const el    = document.getElementById('queue-list');
  el.innerHTML = blastQueue.map((lead, i) => {
    const sent   = i < blastIdx;
    const active = i === blastIdx && blastRunning;
    const filled = msg.replace(/\{\{name\}\}/g, lead.name || '');
    return `<div class="queue-item${sent?' sent':''}${active?' active':''}" id="qi-${lead.id}">
      <div class="qi-info">
        <div class="qi-name">${esc(lead.name||'No name')} ${sent?'✅':''}</div>
        <div class="qi-num">📞 ${esc(lead.contact)}</div>
        <div class="qi-msg">${esc(filled.slice(0,60))}…</div>
      </div>
      ${blastModeType==='queue' ? `
        <button class="qi-send" ${sent?'disabled':''} onclick="sendOne(${i})">
          ${sent?'Sent':'Send'}
        </button>` : ''}
    </div>`;
  }).join('');
}

// ── QUEUE MODE ───────────────────────────────────────────────
function sendOne(idx) {
  const lead = blastQueue[idx];
  if (!lead) return;
  const msg  = buildMsg(lead);
  openWA(lead.contact, msg);
  blastIdx = idx + 1;
  // Log to sheet
  logBlastToSheet(lead);
  renderQueue();
  updateProgress();
  if (blastIdx >= blastQueue.length) toast('All messages sent! 🎉', 'ok');
}

// ── AUTO MODE ────────────────────────────────────────────────
function startBlast() {
  if (!blastQueue.length) { toast('No leads in queue', 'err'); return; }
  const msg = document.getElementById('blast-msg').value.trim();
  if (!msg) { toast('Please type a message first', 'err'); return; }

  blastRunning = true; blastPaused = false;
  document.getElementById('blast-start-btn').style.display = 'none';
  document.getElementById('blast-progress').classList.remove('hide');

  if (blastModeType === 'auto') {
    document.getElementById('blast-pause-btn').style.display = 'flex';
    document.getElementById('countdown-wrap').classList.remove('hide');
    sendNextAuto();
  } else {
    renderQueue();
  }
}

function sendNextAuto() {
  if (blastPaused || !blastRunning) return;
  if (blastIdx >= blastQueue.length) {
    stopCountdown();
    toast('🎉 Blast complete! ' + blastQueue.length + ' messages sent', 'ok');
    document.getElementById('countdown-wrap').classList.add('hide');
    document.getElementById('blast-pause-btn').style.display = 'none';
    blastRunning = false;
    return;
  }

  const lead = blastQueue[blastIdx];
  const msg  = buildMsg(lead);
  openWA(lead.contact, msg);
  logBlastToSheet(lead);
  updateProgress();
  renderQueue();
  blastIdx++;

  if (blastIdx < blastQueue.length) {
    startCountdown(blastDelay, sendNextAuto);
  } else {
    stopCountdown();
    document.getElementById('countdown-wrap').classList.add('hide');
    document.getElementById('blast-pause-btn').style.display = 'none';
    blastRunning = false;
    toast('🎉 Blast complete! All ' + blastQueue.length + ' messages sent', 'ok');
  }
}

function pauseBlast() {
  blastPaused = !blastPaused;
  document.getElementById('blast-pause-btn').textContent = blastPaused ? '▶ Resume' : '⏸ Pause';
  if (!blastPaused) sendNextAuto();
  else stopCountdown();
}

// ── COUNTDOWN TIMER ──────────────────────────────────────────
function startCountdown(secs, onDone) {
  stopCountdown();
  countdownSec = secs;
  const total  = secs;
  updateCountdownUI(secs, total);
  countdownTimer = setInterval(() => {
    if (blastPaused) return;
    countdownSec--;
    updateCountdownUI(countdownSec, total);
    if (countdownSec <= 0) {
      stopCountdown();
      onDone();
    }
  }, 1000);
}

function stopCountdown() {
  clearInterval(countdownTimer);
  countdownTimer = null;
}

function updateCountdownUI(secs, total) {
  const m = Math.floor(secs/60), s = secs%60;
  document.getElementById('countdown-num').textContent  = m + ':' + String(s).padStart(2,'0');
  document.getElementById('countdown-lbl').textContent  = 'Next message in… (' + (blastIdx+1) + '/' + blastQueue.length + ')';
  document.getElementById('countdown-fill').style.width = (secs/total*100) + '%';
}

function updateProgress() {
  const pct = Math.round(blastIdx / blastQueue.length * 100);
  document.getElementById('bp-fill').style.width = pct + '%';
  document.getElementById('bp-lbl').textContent  = blastIdx + ' / ' + blastQueue.length + ' sent';
}

// ── HELPERS ──────────────────────────────────────────────────
function buildMsg(lead) {
  const tmpl = document.getElementById('blast-msg').value ||
    'Hi {{name}}, following up on your property enquiry 😊';
  return tmpl.replace(/\{\{name\}\}/g, lead.name || '').replace(/\{\{agent\}\}/g, currentUser.name);
}

function openWA(contact, msg) {
  const clean = String(contact).replace(/[\s\-]/g,'');
  const num   = clean.startsWith('0') ? '6'+clean : clean;
  window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg));
}

function logBlastToSheet(lead) {
  // Log WhatsApp timestamp to sheet silently
  const proj = PROJECTS[activeProjIdx] || PROJECTS[0];
  if (!proj) return;
  const url  = currentUser.role === 'boss'
    ? (agentList.find(a=>a.name===lead.agentName)||{}).scriptUrl
    : currentUser.scriptUrl;
  if (!url) return;
  fetch(url + '?action=logWhatsApp&rowIndex=' + lead.rowIndex +
    '&sheet=' + encodeURIComponent(lead.project||proj.name) +
    '&agent=' + encodeURIComponent(currentUser.name) + '&t=' + Date.now())
  .catch(e => console.warn('logBlast:', e));
}

// ═══════════════════════════════════════════════════════════════
//  INIT — restore session or show login
// ═══════════════════════════════════════════════════════════════
window.onload = () => {
  masterUrl = localStorage.getItem('crm_master_url') || 'https://script.google.com/macros/s/AKfycby6qZj-DspeFyVuGx-CxOT1QzOYcEfc6C5vtOjJZWqr2YS_vqMZHYAtkC2rCXMVn2ps/exec';

  // Clear any corrupted old sessions from previous app versions
  const APP_VERSION = 'v3';
  if (localStorage.getItem('crm_app_version') !== APP_VERSION) {
    localStorage.removeItem('crm_session');
    localStorage.setItem('crm_app_version', APP_VERSION);
    console.log('Old session cleared — please sign in again');
  }

  const session = JSON.parse(localStorage.getItem('crm_session') || 'null');
  if (session && masterUrl && (Date.now() - session.ts) < 30*24*3600*1000) {
    currentUser = { name:session.name, username:session.username, role:session.role,
                    scriptUrl:session.scriptUrl, color:session.color||'#3b7fff' };
    startApp();
    return;
  }

  document.getElementById('login-username').focus();
};

window.addEventListener('focus', () => {
  if (currentUser && masterUrl) {
    if (currentUser.role === 'boss') fetchAllAgents();
    else fetchAgentLeads(currentUser, false);
  }
});
