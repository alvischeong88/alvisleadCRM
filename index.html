<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSG Property — Lead Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/tabulator-tables@5.6.1/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1B2430;
    --paper:#F6F3ED;
    --paper-raised:#FFFFFF;
    --brass:#B98A3D;
    --brass-dark:#8F6A2C;
    --sage:#4C7A63;
    --rust:#B24C3B;
    --slate:#667085;
    --line:#E4DFD5;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  h1,h2,h3,.brand{
    font-family:'Fraunces',serif;
  }
  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 36px;
    width:100%;
    max-width:360px;
    position:relative;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
    background:var(--brass);
    border-radius:var(--radius) var(--radius) 0 0;
  }
  .brand{
    font-size:22px;
    font-weight:600;
    margin:0 0 4px;
  }
  .brand-sub{
    color:var(--slate);
    font-size:13px;
    margin:0 0 28px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:500;
    color:var(--slate);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:inherit;
    font-size:14px;
    background:var(--paper);
  }
  .field input:focus{
    outline:none;
    border-color:var(--brass);
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    padding:11px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-size:14px;
    font-weight:500;
    margin-top:8px;
  }
  .btn-primary:hover{background:var(--brass-dark);}
  #login-error{
    color:var(--rust);
    font-size:13px;
    margin-top:12px;
    display:none;
  }

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;flex-direction:column;}
  header{
    background:var(--ink);
    color:var(--paper);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header .brand{color:var(--paper);font-size:18px;margin:0;}
  .who{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .badge{
    padding:3px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:500;
    background:var(--brass);
    color:var(--ink);
  }
  .logout-link{
    color:var(--paper);
    opacity:0.7;
    background:none;
    border:none;
    font-size:13px;
    text-decoration:underline;
  }
  .logout-link:hover{opacity:1;}

  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 24px;
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:var(--radius);}
  .tab-btn{
    padding:8px 16px;
    border:none;
    background:transparent;
    border-radius:4px;
    font-size:13px;
    font-weight:500;
    color:var(--slate);
  }
  .tab-btn.active{background:var(--ink);color:var(--paper);}
  select, .add-btn{
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:inherit;
    font-size:13px;
    background:var(--paper-raised);
  }
  .add-btn{
    background:var(--sage);
    color:white;
    border:none;
    font-weight:500;
  }
  .spacer{flex:1;}

  main{flex:1;padding:20px 24px;}
  #grid-view, #form-view{display:none;}
  #grid-view.active, #form-view.active{display:block;}

  #lead-grid{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }

  /* Form / card view */
  .card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .lead-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .lead-card:hover{border-color:var(--brass);}
  .lead-card .name{font-weight:600;font-size:15px;margin-bottom:4px;}
  .lead-card .meta{font-size:12px;color:var(--slate);margin-bottom:8px;}
  .status-pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:500;
    background:#EFE9DC;
    color:var(--ink);
  }
  .lead-card .remarks{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(27,36,48,0.5);
    align-items:center;justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--paper-raised);
    border-radius:var(--radius);
    max-width:520px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    padding:28px;
  }
  .modal h2{margin:0 0 20px;font-size:20px;}
  .modal .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-family:inherit;
    font-size:14px;
    resize:vertical;
    min-height:70px;
    background:var(--paper);
  }
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-secondary{
    flex:1;
    padding:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    font-size:14px;
  }
  .btn-primary.modal-save{flex:1;margin-top:0;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--slate);
  }

  @media (max-width:640px){
    .card-list{grid-template-columns:1fr;}
    header, .toolbar{padding:12px 16px;}
    main{padding:14px 16px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <p class="brand">CSG Property</p>
    <p class="brand-sub">Lead Desk — sign in to continue</p>
    <div class="field">
      <label for="login-name">Username</label>
      <input id="login-name" type="text" autocomplete="username" placeholder="e.g. steph">
    </div>
    <div class="field">
      <label for="login-pin">Password</label>
      <input id="login-pin" type="password" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="btn-primary" onclick="handleLogin()">Sign in</button>
    <p id="login-error">Username or password is incorrect.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <p class="brand">CSG Property — Lead Desk</p>
    <div class="who">
      <span id="who-name"></span>
      <span class="badge" id="who-role"></span>
      <button class="logout-link" onclick="handleLogout()">Sign out</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" id="tab-grid" onclick="switchTab('grid')">Grid view</button>
      <button class="tab-btn" id="tab-form" onclick="switchTab('form')">Card view</button>
    </div>
    <select id="project-filter" onchange="applyFilters()">
      <option value="">All projects</option>
    </select>
    <select id="status-filter" onchange="applyFilters()">
      <option value="">All statuses</option>
    </select>
    <div class="spacer"></div>
    <button class="add-btn" onclick="addLead()">+ New lead</button>
  </div>

  <main>
    <div id="grid-view" class="active">
      <div id="lead-grid"></div>
    </div>
    <div id="form-view">
      <div class="card-list" id="card-list"></div>
      <div class="empty-state" id="card-empty" style="display:none;">No leads match the current filters.</div>
    </div>
  </main>
</div>

<!-- ============ EDIT MODAL (card view) ============ -->
<div class="modal-overlay" id="lead-modal">
  <div class="modal">
    <h2 id="modal-title">Lead details</h2>
    <div class="field"><label>Name</label><input id="m-name" type="text"></div>
    <div class="field"><label>Contact</label><input id="m-contact" type="text"></div>
    <div class="field"><label>Project</label><input id="m-project" type="text"></div>
    <div class="field">
      <label>Status</label>
      <select id="m-status" style="width:100%;">
        <option value="">— none —</option>
        <option>NEW</option>
        <option>FOLLOW UP</option>
        <option>FOLLOW UP APPT</option>
        <option>NO ANSWER</option>
        <option>APPOINTMENT</option>
        <option>NOT INTERESTED</option>
        <option>PRANK LEAD</option>
        <option>BOOKED</option>
      </select>
    </div>
    <div class="field"><label>Remarks</label><textarea id="m-remarks"></textarea></div>
    <div class="field"><label>Customer profile</label><textarea id="m-profile"></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary modal-save" onclick="saveModal()">Save changes</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL = 'https://dgyriewbddxxrfluxiaj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nsYQeVDFgz6yLpaqhZxSPg_ksU58rmg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentAgent = null;   // { name, role }
let allLeads = [];
let table = null;          // Tabulator instance
let editingLeadId = null;

/* ============ LOGIN ============ */
async function handleLogin(){
  const username = document.getElementById('login-name').value.trim();
  const password = document.getElementById('login-pin').value.trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if(!username || !password) return;

  const { data, error } = await sb
    .from('agents')
    .select('name, username, role, active')
    .ilike('username', username)
    .eq('password', password)
    .maybeSingle();

  if(error || !data || data.active === false){
    errEl.style.display = 'block';
    return;
  }

  // "name" is the display name used to tag/filter leads (e.g. matches leads.agent), "username" is only for login
  currentAgent = { name: data.name, role: data.role };
  localStorage.setItem('csg_agent', JSON.stringify(currentAgent));
  startApp();
}

function handleLogout(){
  localStorage.removeItem('csg_agent');
  currentAgent = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  if(table){ table.destroy(); table = null; }
}

/* ============ APP BOOT ============ */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('csg_agent');
  if(saved){
    currentAgent = JSON.parse(saved);
    startApp();
  }
});

async function startApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('who-name').textContent = currentAgent.name;
  document.getElementById('who-role').textContent = currentAgent.role === 'boss' ? 'Boss' : 'Agent';

  await loadLeads();
  buildGrid();
  buildFilters();
  renderCards();
  subscribeRealtime();
}

/* ============ DATA ============ */
async function loadLeads(){
  let query = sb.from('leads').select('*').order('date_added', { ascending:false });
  if(currentAgent.role !== 'boss'){
    query = query.eq('agent', currentAgent.name);
  }
  const { data, error } = await query;
  if(error){ console.error(error); allLeads = []; return; }
  allLeads = data || [];
}

function subscribeRealtime(){
  sb.channel('leads-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'leads' }, async () => {
      await loadLeads();
      if(table) table.replaceData(allLeads);
      renderCards();
    })
    .subscribe();
}

/* ============ FILTERS ============ */
function buildFilters(){
  const projects = [...new Set(allLeads.map(l => l.project_name).filter(Boolean))].sort();
  const statuses = [...new Set(allLeads.map(l => l.status).filter(Boolean))].sort();
  const pf = document.getElementById('project-filter');
  const sf = document.getElementById('status-filter');
  pf.innerHTML = '<option value="">All projects</option>' + projects.map(p=>`<option>${p}</option>`).join('');
  sf.innerHTML = '<option value="">All statuses</option>' + statuses.map(s=>`<option>${s}</option>`).join('');
}

function getFiltered(){
  const p = document.getElementById('project-filter').value;
  const s = document.getElementById('status-filter').value;
  return allLeads.filter(l => (!p || l.project_name===p) && (!s || l.status===s));
}

function applyFilters(){
  if(table) table.setData(getFiltered());
  renderCards();
}

/* ============ TABS ============ */
function switchTab(tab){
  document.getElementById('tab-grid').classList.toggle('active', tab==='grid');
  document.getElementById('tab-form').classList.toggle('active', tab==='form');
  document.getElementById('grid-view').classList.toggle('active', tab==='grid');
  document.getElementById('form-view').classList.toggle('active', tab==='form');
  if(tab==='grid' && table) table.redraw();
}

/* ============ GRID VIEW (Tabulator) ============ */
function buildGrid(){
  const cols = [
    {title:"Date", field:"date_added", editor:"input", width:110},
    {title:"Name", field:"name", editor:"input", width:150},
    {title:"Contact", field:"contact", editor:"input", width:130},
    {title:"Project", field:"project_name", editor:"input", width:130},
    {title:"Status", field:"status", editor:"list",
      editorParams:{values:["NEW","FOLLOW UP","FOLLOW UP APPT","NO ANSWER","APPOINTMENT","NOT INTERESTED","PRANK LEAD","BOOKED"]},
      width:140},
    {title:"Remarks", field:"remarks", editor:"textarea", width:280},
    {title:"Customer Profile", field:"customer_profile", editor:"textarea", width:220},
  ];
  if(currentAgent.role === 'boss'){
    cols.splice(1,0,{title:"Agent", field:"agent", editor:"input", width:100});
  }

  table = new Tabulator("#lead-grid", {
    data: getFiltered(),
    layout:"fitDataStretch",
    height:"calc(100vh - 230px)",
    clipboard:true,
    clipboardPasteAction:"range",
    columns: cols,
  });

  table.on("cellEdited", async (cell) => {
    const row = cell.getRow().getData();
    if(!row.id) return;
    const field = cell.getField();
    const value = cell.getValue();
    const { error } = await sb.from('leads').update({ [field]: value }).eq('id', row.id);
    if(error) console.error('Update failed', error);
  });
}

/* ============ CARD / FORM VIEW ============ */
function renderCards(){
  const list = document.getElementById('card-list');
  const empty = document.getElementById('card-empty');
  const rows = getFiltered();
  list.innerHTML = '';
  empty.style.display = rows.length ? 'none' : 'block';

  rows.forEach(lead => {
    const card = document.createElement('div');
    card.className = 'lead-card';
    card.onclick = () => openModal(lead.id);
    card.innerHTML = `
      <div class="name">${escapeHtml(lead.name || 'Unnamed')}</div>
      <div class="meta">${escapeHtml(lead.project_name || 'No project')} · ${escapeHtml(lead.contact || 'No contact')}</div>
      ${lead.status ? `<span class="status-pill">${escapeHtml(lead.status)}</span>` : ''}
      <div class="remarks">${escapeHtml(lead.remarks || '')}</div>
    `;
    list.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

/* ============ MODAL (add/edit) ============ */
function openModal(id){
  editingLeadId = id;
  const lead = allLeads.find(l => l.id === id) || {};
  document.getElementById('modal-title').textContent = id ? 'Edit lead' : 'New lead';
  document.getElementById('m-name').value = lead.name || '';
  document.getElementById('m-contact').value = lead.contact || '';
  document.getElementById('m-project').value = lead.project_name || '';
  document.getElementById('m-status').value = lead.status || '';
  document.getElementById('m-remarks').value = lead.remarks || '';
  document.getElementById('m-profile').value = lead.customer_profile || '';
  document.getElementById('lead-modal').classList.add('active');
}

function closeModal(){
  document.getElementById('lead-modal').classList.remove('active');
  editingLeadId = null;
}

async function saveModal(){
  const payload = {
    name: document.getElementById('m-name').value.trim(),
    contact: document.getElementById('m-contact').value.trim(),
    project_name: document.getElementById('m-project').value.trim(),
    status: document.getElementById('m-status').value || null,
    remarks: document.getElementById('m-remarks').value.trim(),
    customer_profile: document.getElementById('m-profile').value.trim(),
  };

  if(editingLeadId){
    const { error } = await sb.from('leads').update(payload).eq('id', editingLeadId);
    if(error){ alert('Could not save: ' + error.message); return; }
  } else {
    payload.agent = currentAgent.name;
    payload.date_added = new Date().toISOString().slice(0,10);
    const { error } = await sb.from('leads').insert(payload);
    if(error){ alert('Could not create lead: ' + error.message); return; }
  }
  closeModal();
  await loadLeads();
  buildFilters();
  if(table) table.setData(getFiltered());
  renderCards();
}

function addLead(){
  openModal(null);
}
</script>
</body>
</html>
